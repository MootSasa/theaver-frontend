name: Release & Multiplatform Auto-Deploy

on:
  push:
    branches:
      - main
      - beta
      - alpha
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Канал распространения (Release Channel)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - alpha
      version_bump:
        description: 'Правило инкремента версии (Semver Bump)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Пользовательская версия (если bump = custom, например 1.2.0)'
        required: false
        default: ''
        type: string
      force_update:
        description: 'Принудительное обновление для старых клиентов'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: 🏷️ Calculate Semver & Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      clean_version: ${{ steps.calc.outputs.clean_version }}
      build_number: ${{ steps.calc.outputs.build_number }}
      channel: ${{ steps.calc.outputs.channel }}
      tag_name: ${{ steps.calc.outputs.tag_name }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Calculate Version and Release Notes
        id: calc
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--channel ${{ inputs.channel }} --bump ${{ inputs.version_bump }}"
            if [ -n "${{ inputs.custom_version }}" ]; then
              ARGS="$ARGS --custom-version ${{ inputs.custom_version }}"
            fi
          fi
          
          python3 scripts/calculate_release.py $ARGS --github-output --output-file release_notes.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 7

  build-android:
    name: 🤖 Build Android APKs
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Version into pubspec.yaml
        run: |
          python3 -c "import re; p='pubspec.yaml'; s=open(p,'r',encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(re.sub(r'version:\s*[^\n]+', 'version: ${{ needs.prepare-release.outputs.clean_version }}+${{ needs.prepare-release.outputs.build_number }}', s))"

      - name: Setup Google, HMS Services Config & Signing Keystore
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          AGCONNECT_SERVICES: ${{ secrets.AGCONNECT_SERVICES_JSON }}
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > android/app/google-services.json
          fi
          if [ -n "$AGCONNECT_SERVICES" ]; then
            echo "$AGCONNECT_SERVICES" > android/app/agconnect-services.json
          fi
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > android/app/debug.keystore
            echo "✅ Restored consistent Android signing keystore"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Adjust Gradle memory for CI runner
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i 's/-Xmx8G/-Xmx3500m/g' android/gradle.properties
            sed -i 's/-XX:MaxMetaspaceSize=4G/-XX:MaxMetaspaceSize=1024m/g' android/gradle.properties
          fi

      - name: Cache Android SDK CMake & NDK
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/ndk/25.1.8937393
          key: android-sdk-cmake-3.22.1-ndk-25.1.8937393

      - name: Setup Android SDK Components (CMake & NDK)
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKM="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          echo "Accepting Android SDK licenses..."
          yes | flutter doctor --android-licenses || true
          yes | "$SDKM" --licenses || true
          
          echo "Ensuring CMake 3.22.1 is installed..."
          if [ ! -x "$SDK_DIR/cmake/3.22.1/bin/cmake" ]; then
            for i in 1 2 3; do
              echo "Installing cmake;3.22.1 (attempt $i)..."
              yes | "$SDKM" --install "cmake;3.22.1" && break || {
                echo "CMake install attempt $i failed, retrying in 5s..."
                sleep 5
              }
            done
          fi
          
          echo "Ensuring NDK 25.1.8937393 is installed..."
          if [ ! -d "$SDK_DIR/ndk/25.1.8937393" ]; then
            for i in 1 2 3; do
              echo "Installing ndk;25.1.8937393 (attempt $i)..."
              yes | "$SDKM" --install "ndk;25.1.8937393" && break || {
                echo "NDK 25.1.8937393 install attempt $i failed, retrying in 5s..."
                sleep 5
              }
            done
          fi
          
          if [ -x "$SDK_DIR/cmake/3.22.1/bin/cmake" ]; then
            echo "✅ Android CMake 3.22.1 ready: $($SDK_DIR/cmake/3.22.1/bin/cmake --version | head -n 1)"
          else
            echo "❌ Failed to setup CMake 3.22.1"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal & Split APKs
        run: |
          VER="${{ needs.prepare-release.outputs.version }}"
          BUILD="${{ needs.prepare-release.outputs.build_number }}"
          CH="${{ needs.prepare-release.outputs.channel }}"
          BDATE="$(date +'%d.%m.%Y')"
          DEFINES="--dart-define=APP_VERSION=$VER --dart-define=APP_BUILD_NUMBER=$BUILD --dart-define=BUILD_DATE=$BDATE"
          
          echo "Building Universal APK (v$VER #$BUILD)..."
          flutter build apk --release --build-name="$VER" --build-number="$BUILD" $DEFINES
          
          echo "Building Split APKs (v$VER #$BUILD)..."
          flutter build apk --release --split-per-abi --build-name="$VER" --build-number="$BUILD" $DEFINES
          
          mkdir -p dist/android
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          
          if [ -f "$OUTPUT_DIR/app-release.apk" ]; then
            cp "$OUTPUT_DIR/app-release.apk" "dist/android/theaver-v${VER}-${CH}-universal.apk"
          fi
          
          for apk in "$OUTPUT_DIR"/*arm64-v8a*.apk; do
            [ -f "$apk" ] && cp "$apk" "dist/android/theaver-v${VER}-${CH}-arm64-v8a.apk"
          done
          
          for apk in "$OUTPUT_DIR"/*armeabi-v7a*.apk; do
            [ -f "$apk" ] && cp "$apk" "dist/android/theaver-v${VER}-${CH}-armeabi-v7a.apk"
          done
          
          for apk in "$OUTPUT_DIR"/*x86_64*.apk; do
            [ -f "$apk" ] && cp "$apk" "dist/android/theaver-v${VER}-${CH}-x86_64.apk"
          done
          
          echo "Prepared Android binaries:"
          ls -la dist/android/

      - name: Upload Android Binaries
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: dist/android/*.apk
          retention-days: 7

  build-windows:
    name: 🪟 Build Windows x64
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Version into pubspec.yaml
        shell: pwsh
        run: |
          python -c "import re, os; path='pubspec.yaml'; ver='${{ needs.prepare-release.outputs.clean_version }}+${{ needs.prepare-release.outputs.build_number }}'; text=open(path, 'r', encoding='utf-8').read(); open(path, 'w', encoding='utf-8').write(re.sub(r'version:\s*[^\n]+', f'version: {ver}', text))"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins compiler flags
        shell: pwsh
        run: |
          Get-ChildItem -Path windows\flutter\ephemeral\.plugin_symlinks -Recurse -Filter "CMakeLists.txt" -ErrorAction SilentlyContinue | ForEach-Object {
            (Get-Content $_.FullName) -replace '-Werror', '' | Set-Content $_.FullName
          }

      - name: Build Windows Executable
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          _CL_: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          $ver = "${{ needs.prepare-release.outputs.version }}"
          $build = "${{ needs.prepare-release.outputs.build_number }}"
          $bdate = (Get-Date -Format "dd.MM.yyyy")
          flutter build windows --release --dart-define="APP_VERSION=$ver" --dart-define="APP_BUILD_NUMBER=$build" --dart-define="BUILD_DATE=$bdate"

      - name: Package Windows Portable ZIP & Setup Installer
        shell: pwsh
        run: |
          $ver = "${{ needs.prepare-release.outputs.version }}"
          $ch = "${{ needs.prepare-release.outputs.channel }}"
          $releaseDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          $outDir = (Resolve-Path "dist/windows").Path
          $zipOutput = Join-Path $outDir "theaver-v${ver}-${ch}-windows-x64.zip"
          
          Write-Host "Compressing $releaseDir into $zipOutput..."
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipOutput -Force
          Write-Host "Created $zipOutput"
          
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (Test-Path $iscc) {
            $setupBaseName = "theaver-v${ver}-${ch}-windows-x64-setup"
            $iconPath = (Resolve-Path "windows/runner/resources/app_icon.ico").Path
            Write-Host "Building Windows Setup Installer ($setupBaseName.exe)..."
            & $iscc `
              "/DMyAppVersion=$ver" `
              "/DMySourceDir=$releaseDir" `
              "/DMyOutputDir=$outDir" `
              "/DMyOutputBaseFilename=$setupBaseName" `
              "/DMyIconFile=$iconPath" `
              "windows/installer/setup.iss"
            Write-Host "Created Windows Setup Installer in $outDir"
          } else {
            Write-Warning "Inno Setup compiler (ISCC.exe) not found, skipping installer build."
          }
          Get-ChildItem $outDir

      - name: Upload Windows Binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
          retention-days: 7


  build-linux:
    name: 🐧 Build Linux x64
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Version into pubspec.yaml
        run: |
          python3 -c "import re; p='pubspec.yaml'; s=open(p,'r',encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(re.sub(r'version:\s*[^\n]+', 'version: ${{ needs.prepare-release.outputs.clean_version }}+${{ needs.prepare-release.outputs.build_number }}', s))"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libasound2-dev \
            libpulse-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libsqlite3-dev \
            libnotify-dev \
            libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Patch plugins compiler flags
        run: |
          if [ -d "linux/flutter/ephemeral/.plugin_symlinks" ]; then
            find linux/flutter/ephemeral/.plugin_symlinks -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +
          fi

      - name: Build Linux Application
        run: |
          VER="${{ needs.prepare-release.outputs.version }}"
          BUILD="${{ needs.prepare-release.outputs.build_number }}"
          BDATE="$(date +'%d.%m.%Y')"
          flutter build linux --release --dart-define=APP_VERSION="$VER" --dart-define=APP_BUILD_NUMBER="$BUILD" --dart-define=BUILD_DATE="$BDATE"

      - name: Package Linux Bundle into tar.gz
        run: |
          VER="${{ needs.prepare-release.outputs.version }}"
          CH="${{ needs.prepare-release.outputs.channel }}"
          BUNDLE_DIR="build/linux/x64/release/bundle"
          mkdir -p dist/linux
          ARCHIVE_NAME="dist/linux/theaver-v${VER}-${CH}-linux-x64.tar.gz"
          
          tar -czf "$ARCHIVE_NAME" -C "$BUNDLE_DIR" .
          echo "Created $ARCHIVE_NAME"

      - name: Upload Linux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/linux/*.tar.gz
          retention-days: 7

  build-macos:
    name: 🍏 Build macOS Apps
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Version into pubspec.yaml
        run: |
          python3 -c "import re; p='pubspec.yaml'; s=open(p,'r',encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(re.sub(r'version:\s*[^\n]+', 'version: ${{ needs.prepare-release.outputs.clean_version }}+${{ needs.prepare-release.outputs.build_number }}', s))"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: |
          VER="${{ needs.prepare-release.outputs.version }}"
          BUILD="${{ needs.prepare-release.outputs.build_number }}"
          BDATE="$(date +'%d.%m.%Y')"
          flutter build macos --release --dart-define=APP_VERSION="$VER" --dart-define=APP_BUILD_NUMBER="$BUILD" --dart-define=BUILD_DATE="$BDATE"

      - name: Package Universal and Sliced macOS Bundles
        run: |
          VER="${{ needs.prepare-release.outputs.version }}"
          CH="${{ needs.prepare-release.outputs.channel }}"
          OUT_DIR="$GITHUB_WORKSPACE/dist/macos"
          mkdir -p "$OUT_DIR"
          
          PRODUCTS_DIR="build/macos/Build/Products/Release"
          APP_PATH=$(ls -d "$PRODUCTS_DIR"/*.app | head -n 1)
          APP_NAME=$(basename "$APP_PATH")
          
          echo "Packaging macOS app: $APP_NAME in $PRODUCTS_DIR to $OUT_DIR..."
          cd "$PRODUCTS_DIR"
          
          # 1. Universal ZIP
          ditto -c -k --keepParent "$APP_NAME" "$OUT_DIR/theaver-v${VER}-${CH}-macos-universal.zip"
          echo "Created Universal ZIP"
          
          # 2. ARM64 (Apple Silicon M-series)
          cp -R "$APP_NAME" "theaver-arm64.app"
          APP_BIN="theaver-arm64.app/Contents/MacOS/${APP_NAME%.app}"
          if [ -f "$APP_BIN" ]; then
            lipo "$APP_BIN" -thin arm64 -output "$APP_BIN" 2>/dev/null || true
          fi
          for FW in theaver-arm64.app/Contents/Frameworks/*.framework; do
            [ -d "$FW" ] || continue
            FW_NAME=$(basename "$FW" .framework)
            if [ -f "$FW/$FW_NAME" ]; then
              lipo "$FW/$FW_NAME" -thin arm64 -output "$FW/$FW_NAME" 2>/dev/null || true
            fi
          done
          ditto -c -k --keepParent "theaver-arm64.app" "$OUT_DIR/theaver-v${VER}-${CH}-macos-arm64.zip"
          rm -rf "theaver-arm64.app"
          echo "Created ARM64 ZIP"
          
          # 3. x86_64 (Intel)
          cp -R "$APP_NAME" "theaver-x86_64.app"
          APP_BIN_INTEL="theaver-x86_64.app/Contents/MacOS/${APP_NAME%.app}"
          if [ -f "$APP_BIN_INTEL" ]; then
            lipo "$APP_BIN_INTEL" -thin x86_64 -output "$APP_BIN_INTEL" 2>/dev/null || true
          fi
          for FW in theaver-x86_64.app/Contents/Frameworks/*.framework; do
            [ -d "$FW" ] || continue
            FW_NAME=$(basename "$FW" .framework)
            if [ -f "$FW/$FW_NAME" ]; then
              lipo "$FW/$FW_NAME" -thin x86_64 -output "$FW/$FW_NAME" 2>/dev/null || true
            fi
          done
          ditto -c -k --keepParent "theaver-x86_64.app" "$OUT_DIR/theaver-v${VER}-${CH}-macos-x64.zip"
          rm -rf "theaver-x86_64.app"
          echo "Created x86_64 ZIP"
          
          echo "Prepared macOS binaries:"
          ls -lh "$OUT_DIR"

      - name: Upload macOS Binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/macos/*.zip
          retention-days: 7

  build-ios:
    name: 📱 Build iOS IPA
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Version into pubspec.yaml
        run: |
          python3 -c "import re; p='pubspec.yaml'; s=open(p,'r',encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(re.sub(r'version:\s*[^\n]+', 'version: ${{ needs.prepare-release.outputs.clean_version }}+${{ needs.prepare-release.outputs.build_number }}', s))"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Build and Sign iOS IPA
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          VER="${{ needs.prepare-release.outputs.version }}"
          BUILD="${{ needs.prepare-release.outputs.build_number }}"
          CH="${{ needs.prepare-release.outputs.channel }}"
          mkdir -p dist/ios

          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_MOBILEPROVISION_BASE64" ]; then
            echo "🔑 Apple signing credentials detected. Setting up temporary keychain..."
            export CERTIFICATE_PATH="$RUNNER_TEMP/build_cert.p12"
            export PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            KEYCHAIN_PASSWORD="temp_keychain_password_987"

            # 1. Decode base64 using Python (cross-platform and reliable)
            python3 -c "import base64, os; open(os.environ['CERTIFICATE_PATH'], 'wb').write(base64.b64decode(os.environ['IOS_P12_BASE64'].strip()))"
            python3 -c "import base64, os; open(os.environ['PP_PATH'], 'wb').write(base64.b64decode(os.environ['IOS_MOBILEPROVISION_BASE64'].strip()))"

            # 2. Setup Keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH" || true
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
            security import "$CERTIFICATE_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" || true
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"') || true

            # 3. Install Provisioning Profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            UUID=$(python3 -c "import re, os; m=re.search(r'<key>UUID</key>\s*<string>([a-fA-F0-9\-]+)</string>', open(os.environ['PP_PATH'],'rb').read().decode('latin1', errors='ignore')); print(m.group(1) if m else '')")
            if [ -n "$UUID" ]; then
              echo "Installed provisioning profile UUID: $UUID"
              cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"
            fi
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

            # 4. Build iOS Release Application
            echo "📱 Building iOS application (v$VER #$BUILD)..."
            flutter pub get
            flutter build ios --release --build-name="$VER" --build-number="$BUILD" || {
              echo "⚠️ Signed build failed, trying with --no-codesign..."
              flutter build ios --release --no-codesign --build-name="$VER" --build-number="$BUILD"
            }

            if [ -d "build/ios/iphoneos/Runner.app" ]; then
              echo "Packaging Runner.app into IPA..."
              mkdir -p Payload
              cp -R build/ios/iphoneos/Runner.app Payload/
              zip -r -y "dist/ios/theaver-v${VER}-${CH}-ios.ipa" Payload
              rm -rf Payload
            fi
          else
            echo "ℹ️ No Apple signing secrets provided. Building unsigned IPA for sideloading..."
            flutter pub get
            flutter build ios --release --no-codesign --build-name="$VER" --build-number="$BUILD"

            if [ -d "build/ios/iphoneos/Runner.app" ]; then
              mkdir -p Payload
              cp -R build/ios/iphoneos/Runner.app Payload/
              zip -r -y "dist/ios/theaver-v${VER}-${CH}-ios-unsigned.ipa" Payload
              rm -rf Payload
            fi
          fi

          echo "Prepared iOS binaries:"
          ls -lh dist/ios/

      - name: Upload iOS Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ios-binaries
          path: dist/ios/*.ipa
          retention-days: 7

  build-web:
    name: 🌐 Build Web SPA Bundle
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Version into pubspec.yaml
        run: |
          python3 -c "import re; p='pubspec.yaml'; s=open(p,'r',encoding='utf-8').read(); open(p,'w',encoding='utf-8').write(re.sub(r'version:\s*[^\n]+', 'version: ${{ needs.prepare-release.outputs.clean_version }}+${{ needs.prepare-release.outputs.build_number }}', s))"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true

      - name: Install dependencies & patch web plugins
        run: |
          flutter pub get
          PKG_DIR=$(find "$HOME/.pub-cache" -type d -name "ios_color_picker-*" 2>/dev/null | head -n 1 || true)
          if [ -n "$PKG_DIR" ] && [ -d "$PKG_DIR/lib" ] && [ ! -f "$PKG_DIR/lib/ios_color_picker_web.dart" ]; then
            printf "import 'package:flutter_web_plugins/flutter_web_plugins.dart';\nclass IosColorPickerWeb {\n  static void registerWith(Registrar registrar) {}\n}\n" > "$PKG_DIR/lib/ios_color_picker_web.dart"
          fi
          for yaml in $(find "$HOME/.pub-cache" -type f -path "*/liquid_glass_renderer*/pubspec.yaml" 2>/dev/null || true); do
            sed -i '/^flutter:/,$d' "$yaml"
          done

      - name: Build & Package Flutter Web Bundle
        run: |
          VER="${{ needs.prepare-release.outputs.version }}"
          BUILD="${{ needs.prepare-release.outputs.build_number }}"
          CH="${{ needs.prepare-release.outputs.channel }}"
          BDATE="$(date +'%d.%m.%Y')"
          DEFINES="--dart-define=APP_VERSION=$VER --dart-define=APP_BUILD_NUMBER=$BUILD --dart-define=BUILD_DATE=$BDATE"

          echo "🌐 Building Flutter Web bundle (v$VER #$BUILD, channel: $CH)..."
          flutter build web --release --no-web-resources-cdn $DEFINES

          rm -f build/web/assets/assets/fonts/AppleColorEmoji*
          if [ -f build/web/flutter_bootstrap.js ]; then
            sed -i 's/serviceWorkerSettings:/_disabledServiceWorkerSettings:/g' build/web/flutter_bootstrap.js
          fi
          printf 'self.addEventListener("install",function(e){self.skipWaiting()});self.addEventListener("activate",function(e){e.waitUntil(caches.keys().then(function(k){return Promise.all(k.map(function(c){return caches.delete(c)}))}).then(function(){return self.registration.unregister()}).then(function(){return self.clients.matchAll()}).then(function(c){c.forEach(function(cl){if(cl.url&&"navigate"in cl){cl.navigate(cl.url)}})}))});\n' > build/web/flutter_service_worker.js

          mkdir -p dist/web
          tar -czf "dist/web/theaver-v${VER}-${CH}-web.tar.gz" -C build/web .
          echo "Prepared Web bundle:"
          ls -lh dist/web/

      - name: Upload Web Binaries
        uses: actions/upload-artifact@v4
        with:
          name: web-binaries
          path: dist/web/*.tar.gz
          retention-days: 7

  publish-and-deploy:
    name: 🚀 Deploy to Storage & Create GitHub Release
    needs:
      - prepare-release
      - build-android
      - build-windows
      - build-linux
      - build-macos
      - build-ios
      - build-web
    if: |
      always() &&
      needs.prepare-release.result == 'success' &&
      !contains(needs.*.result, 'cancelled') &&
      (
        (github.ref == 'refs/heads/main' && !contains(needs.*.result, 'failure')) ||
        (github.ref != 'refs/heads/main' && (
          needs.build-android.result == 'success' ||
          needs.build-windows.result == 'success' ||
          needs.build-linux.result == 'success' ||
          needs.build-macos.result == 'success' ||
          needs.build-ios.result == 'success' ||
          needs.build-web.result == 'success'
        ))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./

      - name: Download Android Binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-binaries
          path: dist/

      - name: Download Windows Binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-binaries
          path: dist/

      - name: Download Linux Binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: linux-binaries
          path: dist/

      - name: Download macOS Binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: macos-binaries
          path: dist/

      - name: Download iOS Binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-binaries
          path: dist/

      - name: Download Web Binaries
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-binaries
          path: dist/

      - name: List Artifacts to Deploy
        run: |
          echo "Distribution artifacts prepared:"
          find dist/ -type f -exec ls -lh {} + 2>/dev/null || true
          COUNT=$(find dist/ -type f 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No binary artifacts were successfully built and downloaded. Aborting release."
            exit 1
          fi

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Theaver ${{ needs.prepare-release.outputs.tag_name }} (${{ needs.prepare-release.outputs.channel }})
          body_path: release_notes.md
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          draft: false
          files: dist/**/*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Theaver API & MinIO Storage
        continue-on-error: true
        env:
          THEAVER_API_URL: ${{ secrets.THEAVER_API_URL || secrets.MIPTGRAM_API_URL }}
          THEAVER_ADMIN_SECRET: ${{ secrets.THEAVER_ADMIN_SECRET || secrets.MIPTGRAM_ADMIN_SECRET }}
          MIPTGRAM_API_URL: ${{ secrets.THEAVER_API_URL || secrets.MIPTGRAM_API_URL }}
          MIPTGRAM_ADMIN_SECRET: ${{ secrets.THEAVER_ADMIN_SECRET || secrets.MIPTGRAM_ADMIN_SECRET }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_update }}" = "true" ]; then
            FORCE_FLAG="--force-update"
          fi
          
          python3 scripts/deploy_release.py \
            --artifacts-dir dist/ \
            --version "${{ needs.prepare-release.outputs.version }}" \
            --build-number "${{ needs.prepare-release.outputs.build_number }}" \
            --channel "${{ needs.prepare-release.outputs.channel }}" \
            --release-notes-file release_notes.md \
            $FORCE_FLAG

