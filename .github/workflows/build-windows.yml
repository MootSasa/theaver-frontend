name: Build Windows (x64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      flutter_version:
        description: 'Версия Flutter'
        required: true
        default: '3.41.9'
        type: string
      api_base_url:
        description: 'Кастомный API Base URL (опционально, например https://api.theaver.app)'
        required: false
        default: ''
        type: string

jobs:
  build-windows:
    name: Build Windows App (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        shell: pwsh
        run: |
          if (Test-Path ".gitmodules") {
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git submodule sync
            git submodule update --init --recursive
          }

      - name: Locate Flutter project directory
        id: locate_project
        shell: pwsh
        run: |
          if ((Test-Path "frontend") -and (Test-Path "frontend/pubspec.yaml")) {
            echo "path=frontend" >> $env:GITHUB_OUTPUT
          } elseif (Test-Path "pubspec.yaml") {
            echo "path=." >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Flutter pubspec.yaml not found!"
            exit 1
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: flutter pub get

      - name: Patch plugins compiler flags
        working-directory: ${{ steps.locate_project.outputs.path }}
        shell: pwsh
        run: |
          Get-ChildItem -Path windows\flutter\ephemeral\.plugin_symlinks -Recurse -Filter "CMakeLists.txt" -ErrorAction SilentlyContinue | ForEach-Object {
            (Get-Content $_.FullName) -replace '-Werror', '' | Set-Content $_.FullName
          }

      - name: Build Windows
        working-directory: ${{ steps.locate_project.outputs.path }}
        shell: pwsh
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
          _CL_: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"
        run: |
          $extraArgs = ""
          if ("${{ inputs.api_base_url }}" -ne "") {
            $extraArgs = "--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"
          }
          Write-Host "Executing: flutter build windows --${{ inputs.build_type }} $extraArgs"
          flutter build windows --${{ inputs.build_type }} $extraArgs

      - name: Package Windows Portable ZIP & Setup Installer
        shell: pwsh
        run: |
          $buildMode = if ("${{ inputs.build_type }}" -eq "release") { "Release" } else { "Debug" }
          $projectDir = (Resolve-Path "${{ steps.locate_project.outputs.path }}").Path
          $releaseDir = Join-Path $projectDir "build/windows/x64/runner/$buildMode"
          $zipOutput = "theaver-windows-${{ inputs.build_type }}-x64.zip"
          
          if (-not (Test-Path $releaseDir)) {
            Write-Error "Release directory not found: $releaseDir"
            exit 1
          }
          
          Write-Host "Compressing $releaseDir into $zipOutput..."
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipOutput -Force
          Write-Host "Created $zipOutput"
          
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $issPath = Join-Path $projectDir "windows/installer/setup.iss"
          if ((Test-Path $iscc) -and (Test-Path $issPath)) {
            $outDir = (Get-Location).Path
            $setupBaseName = "theaver-windows-${{ inputs.build_type }}-x64-setup"
            $iconPath = Join-Path $projectDir "windows/runner/resources/app_icon.ico"
            & $iscc `
              "/DMySourceDir=$releaseDir" `
              "/DMyOutputDir=$outDir" `
              "/DMyOutputBaseFilename=$setupBaseName" `
              "/DMyIconFile=$iconPath" `
              $issPath
          }

      - name: Upload Windows x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: theaver-windows-${{ inputs.build_type }}-x64
          path: |
            theaver-windows-${{ inputs.build_type }}-x64.zip
            theaver-windows-${{ inputs.build_type }}-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

