name: Build Android (APK)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      target_format:
        description: 'Формат сборки (all = split + universal)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - split-per-abi
          - universal
      flutter_version:
        description: 'Версия Flutter'
        required: true
        default: '3.41.9'
        type: string
      api_base_url:
        description: 'Кастомный API Base URL (опционально, например https://api.theaver.app)'
        required: false
        default: ''
        type: string

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          if [ -f .gitmodules ]; then
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git submodule sync
            git submodule update --init --recursive
          fi

      - name: Locate Flutter project directory
        id: locate_project
        run: |
          if [ -d "frontend" ] && [ -f "frontend/pubspec.yaml" ]; then
            echo "path=frontend" >> $GITHUB_OUTPUT
          elif [ -f "pubspec.yaml" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          else
            echo "Error: Flutter pubspec.yaml not found!" >&2
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Adjust Gradle memory for CI runner
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i 's/-Xmx8G/-Xmx3500m/g' android/gradle.properties
            sed -i 's/-XX:MaxMetaspaceSize=4G/-XX:MaxMetaspaceSize=1024m/g' android/gradle.properties
          fi

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Setup Google, HMS Services Config & Signing Keystore
        working-directory: ${{ steps.locate_project.outputs.path }}
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
          AGCONNECT_SERVICES: ${{ secrets.AGCONNECT_SERVICES_JSON }}
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ] && [ -f android/app/google-services.json.example ]; then
            cp android/app/google-services.json.example android/app/google-services.json
          fi
          if [ -n "$AGCONNECT_SERVICES" ]; then
            echo "$AGCONNECT_SERVICES" > android/app/agconnect-services.json
          elif [ ! -f android/app/agconnect-services.json ] && [ -f android/app/agconnect-services.json.example ]; then
            cp android/app/agconnect-services.json.example android/app/agconnect-services.json
          fi
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > android/app/debug.keystore
            echo "✅ Restored consistent Android signing keystore"
          fi

      - name: Install dependencies
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: flutter pub get

      - name: Build Universal (Fat) APK
        if: ${{ inputs.target_format == 'universal' || inputs.target_format == 'all' }}
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.api_base_url }}" ]; then
            EXTRA_ARGS="--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"
          fi
          echo "Building Universal APK..."
          flutter build apk --${{ inputs.build_type }} $EXTRA_ARGS
          
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          if [ -f "$OUTPUT_DIR/app-${{ inputs.build_type }}.apk" ]; then
            cp "$OUTPUT_DIR/app-${{ inputs.build_type }}.apk" "$OUTPUT_DIR/app-universal-${{ inputs.build_type }}.apk"
            echo "Universal APK created: $OUTPUT_DIR/app-universal-${{ inputs.build_type }}.apk"
          fi

      - name: Build Split per ABI APKs
        if: ${{ inputs.target_format == 'split-per-abi' || inputs.target_format == 'all' }}
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.api_base_url }}" ]; then
            EXTRA_ARGS="--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"
          fi
          echo "Building Split APKs (arm64-v8a, armeabi-v7a, x86_64)..."
          flutter build apk --${{ inputs.build_type }} --split-per-abi $EXTRA_ARGS

      - name: Upload All Android APKs (Archive)
        uses: actions/upload-artifact@v4
        with:
          name: theaver-android-${{ inputs.build_type }}-all-apks
          path: |
            ${{ steps.locate_project.outputs.path }}/build/app/outputs/flutter-apk/*.apk
            ${{ steps.locate_project.outputs.path }}/build/app/outputs/flutter-apk/*.sha1
          if-no-files-found: error
          retention-days: 30

      - name: Upload Universal (Fat) APK
        if: ${{ inputs.target_format == 'universal' || inputs.target_format == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: theaver-android-${{ inputs.build_type }}-universal
          path: ${{ steps.locate_project.outputs.path }}/build/app/outputs/flutter-apk/app-universal-${{ inputs.build_type }}.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ARM64 APK (arm64-v8a)
        if: ${{ inputs.target_format == 'split-per-abi' || inputs.target_format == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: theaver-android-${{ inputs.build_type }}-arm64-v8a
          path: ${{ steps.locate_project.outputs.path }}/build/app/outputs/flutter-apk/*arm64-v8a*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload ARMv7 APK (armeabi-v7a)
        if: ${{ inputs.target_format == 'split-per-abi' || inputs.target_format == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: theaver-android-${{ inputs.build_type }}-armeabi-v7a
          path: ${{ steps.locate_project.outputs.path }}/build/app/outputs/flutter-apk/*armeabi-v7a*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload x86_64 APK
        if: ${{ inputs.target_format == 'split-per-abi' || inputs.target_format == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: theaver-android-${{ inputs.build_type }}-x86_64
          path: ${{ steps.locate_project.outputs.path }}/build/app/outputs/flutter-apk/*x86_64*.apk
          if-no-files-found: warn
          retention-days: 30
