name: Build Linux (x86_64, ARM64)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки (release / debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      flutter_version:
        description: 'Версия Flutter'
        required: true
        default: '3.41.9'
        type: string
      api_base_url:
        description: 'Кастомный API Base URL (опционально, например https://api.theaver.app)'
        required: false
        default: ''
        type: string

jobs:
  build-linux-x64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          if [ -f .gitmodules ]; then
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git submodule sync
            git submodule update --init --recursive
          fi

      - name: Locate Flutter project directory
        id: locate_project
        run: |
          if [ -d "frontend" ] && [ -f "frontend/pubspec.yaml" ]; then
            echo "path=frontend" >> $GITHUB_OUTPUT
          elif [ -f "pubspec.yaml" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          else
            echo "Error: Flutter pubspec.yaml not found!" >&2
            exit 1
          fi

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libasound2-dev \
            libpulse-dev \
            libsecret-1-dev \
            libjsoncpp-dev \
            libsqlite3-dev \
            libnotify-dev \
            libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: flutter pub get

      - name: Patch plugins compiler flags
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: |
          if [ -d "linux/flutter/ephemeral/.plugin_symlinks" ]; then
            find linux/flutter/ephemeral/.plugin_symlinks -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +
          fi

      - name: Build Linux (x86_64)
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.api_base_url }}" ]; then
            EXTRA_ARGS="--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"
          fi
          echo "Building Linux x86_64..."
          flutter build linux --${{ inputs.build_type }} $EXTRA_ARGS

      - name: Package & Sign Linux Bundle (x86_64)
        env:
          LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          PROJECT_DIR="${{ steps.locate_project.outputs.path }}"
          BUNDLE_DIR="$PROJECT_DIR/build/linux/x64/${{ inputs.build_type }}/bundle"
          ARCHIVE_NAME="theaver-linux-${{ inputs.build_type }}-x86_64.tar.gz"
          
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Error: Bundle directory $BUNDLE_DIR not found!" >&2
            exit 1
          fi
          
          echo "Packaging $BUNDLE_DIR into $ARCHIVE_NAME..."
          tar -czf "$ARCHIVE_NAME" -C "$BUNDLE_DIR" .
          if [ -f "$PROJECT_DIR/scripts/sign_linux.sh" ]; then
            bash "$PROJECT_DIR/scripts/sign_linux.sh" "$PWD/$ARCHIVE_NAME"
          fi

      - name: Upload Linux x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: theaver-linux-${{ inputs.build_type }}-x86_64
          path: |
            theaver-linux-${{ inputs.build_type }}-x86_64.tar.gz*
          if-no-files-found: error
          retention-days: 30

  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-24.04-arm
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          if [ -f .gitmodules ]; then
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            git submodule sync
            git submodule update --init --recursive
          fi

      - name: Locate Flutter project directory
        id: locate_project
        run: |
          if [ -d "frontend" ] && [ -f "frontend/pubspec.yaml" ]; then
            echo "path=frontend" >> $GITHUB_OUTPUT
          elif [ -f "pubspec.yaml" ]; then
            echo "path=." >> $GITHUB_OUTPUT
          else
            echo "Error: Flutter pubspec.yaml not found!" >&2
            exit 1
          fi

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libasound2-dev \
            libpulse-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: flutter pub get

      - name: Build Linux (ARM64)
        working-directory: ${{ steps.locate_project.outputs.path }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.api_base_url }}" ]; then
            EXTRA_ARGS="--dart-define=API_BASE_URL=${{ inputs.api_base_url }}"
          fi
          echo "Building Linux ARM64..."
          flutter build linux --${{ inputs.build_type }} $EXTRA_ARGS

      - name: Package & Sign Linux Bundle (ARM64)
        env:
          LINUX_GPG_PRIVATE_KEY_BASE64: ${{ secrets.LINUX_GPG_PRIVATE_KEY_BASE64 }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          PROJECT_DIR="${{ steps.locate_project.outputs.path }}"
          BUNDLE_DIR=$(find "$PROJECT_DIR/build/linux" -type d -name "bundle" | grep -i "${{ inputs.build_type }}" | head -n 1)
          ARCHIVE_NAME="theaver-linux-${{ inputs.build_type }}-arm64.tar.gz"
          
          if [ -z "$BUNDLE_DIR" ] || [ ! -d "$BUNDLE_DIR" ]; then
            echo "Error: Bundle directory not found!" >&2
            exit 1
          fi
          
          echo "Packaging $BUNDLE_DIR into $ARCHIVE_NAME..."
          tar -czf "$ARCHIVE_NAME" -C "$BUNDLE_DIR" .
          if [ -f "$PROJECT_DIR/scripts/sign_linux.sh" ]; then
            bash "$PROJECT_DIR/scripts/sign_linux.sh" "$PWD/$ARCHIVE_NAME"
          fi

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: theaver-linux-${{ inputs.build_type }}-arm64
          path: |
            theaver-linux-${{ inputs.build_type }}-arm64.tar.gz*
          if-no-files-found: warn
          retention-days: 30
